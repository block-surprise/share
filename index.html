<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>ShareFlow</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">SHAREFLOW</div>
      <h1 id="pageTitle">ホーム</h1>
    </div>
    <div class="connection"><span id="dot"></span><span id="connectionText">接続中…</span></div>
  </header>

  <main id="content">
    <section class="page active" data-page="home">
      <div class="hero-card glass">
        <div class="hero-icon">↗</div>
        <div>
          <div class="hero-title">Windowsへ送る</div>
          <div class="hero-sub">テキストや画像をすぐに共有できます。</div>
        </div>
      </div>

      <label class="label">メッセージ</label>
      <textarea id="message" placeholder="ここに入力…" maxlength="5000"></textarea>
      <div class="composer-row">
        <button class="secondary" id="imageBtn">＋ 画像</button>
        <span id="charCount">0 / 5000</span>
      </div>
      <input id="imageInput" type="file" accept="image/*" hidden>
      <div id="preview"></div>
      <button class="primary" id="sendBtn">送信</button>

      <div class="section-head"><span>最近の送信</span><button class="link" data-go="history">すべて見る</button></div>
      <div id="recent" class="history-list"></div>
    </section>

    <section class="page" data-page="history">
      <div class="search"><span>⌕</span><input id="search" placeholder="履歴を検索"></div>
      <div id="history" class="history-list"></div>
      <button class="danger ghost" id="clearHistory">履歴をすべて削除</button>
    </section>

    <section class="page" data-page="send">
      <div class="big-action glass">
        <div class="big-icon">↗</div><h2>送信</h2><p>Windowsへ共有する内容を選択してください。</p>
      </div>
      <button class="menu-card" data-focus="message"><b>テキスト</b><span>メッセージを送信</span><i>›</i></button>
      <button class="menu-card" id="imageBtn2"><b>画像</b><span>写真やスクリーンショットを送信</span><i>›</i></button>
    </section>

    <section class="page" data-page="devices">
      <div class="device-card glass">
        <div class="device-icon">▣</div>
        <div><b>このデバイス</b><span>iPhone / Web App</span></div><em>●</em>
      </div>
      <div class="qr-card">
        <h2>Windowsを接続</h2>
        <p>Windows側でこのWebアプリを開いて接続してください。</p>
        <div class="qr-placeholder">QR</div>
        <button class="secondary full" id="copyUrl">接続URLをコピー</button>
      </div>
      <p class="note">現在のスターター版では、同じサーバーに接続した端末へリアルタイム送信します。</p>
    </section>

    <section class="page" data-page="settings">
      <div class="settings-group">
        <div class="settings-row"><span>外観</span><select id="theme"><option value="system">システムに合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div>
        <div class="settings-row"><span>履歴の保存</span><label class="switch"><input id="saveHistory" type="checkbox" checked><span></span></label></div>
        <div class="settings-row"><span>送信後に入力を消去</span><label class="switch"><input id="clearAfter" type="checkbox" checked><span></span></label></div>
      </div>
      <div class="about glass"><b>ShareFlow</b><span>iPhone ⇄ Windows テキスト共有</span><small>Starter v1.0</small></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home"><span>⌂</span><small>ホーム</small></button>
    <button class="tab" data-tab="history"><span>◷</span><small>履歴</small></button>
    <button class="tab" data-tab="send"><span>↗</span><small>送信</small></button>
    <button class="tab" data-tab="devices"><span>▣</span><small>デバイス</small></button>
    <button class="tab" data-tab="settings"><span>⚙</span><small>設定</small></button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
